[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multilayer-optical-network"
version = "0.1.0"
description = "Deterministic multi-layer optical network model: IP-over-optical topology, GNPy QoT adapter, solvers, and validator. Usable standalone, or as the physical/IP-layer backend behind multilayer-optical-mcp."
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "gnpy==2.14.0",
    "networkx>=3.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    # model/violations.py uses pydantic for typed violation schemas.
    "pydantic>=2.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.15.15"]

[project.scripts]
multilayer-optical-network-build = "multilayer_optical_network.build_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Runtime data the installed wheel must ship: the modulation-format catalog
# every ModeRegistry loads, and the german_17 reference topology used by the
# scenario builder and traffic generator. (Test-only oracles — eqpt/,
# toy_2span.json — live under tests/fixtures/ instead; they never ship.)
multilayer_optical_network = ["data/*.yaml", "data/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff.lint.per-file-ignores]
# Tests deliberately group imports right above the section that uses them
# (each "# --- Task N ---" block is self-contained) and use semicolon-joined
# setup/assert one-liners for compact test bodies. Both are consistent,
# intentional conventions here, not accidental placement/formatting.
"tests/**" = ["E402", "E702"]
