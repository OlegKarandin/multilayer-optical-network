[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multilayer-optical-mcp"
version = "0.1.0"
description = "MCP server for multi-layer optical network reasoning (GNPy QoT + IP-over-optical)."
requires-python = ">=3.11"
readme = "CLAUDE.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "gnpy==2.14.0",
    "networkx>=3.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    # model/violations.py uses pydantic for typed violation schemas; it's a
    # core-layer dependency, not MCP-specific, so it lives here rather than
    # behind the `server` extra.
    "pydantic>=2.12",
]

[project.optional-dependencies]
server = ["mcp[cli]>=2.0"]
# dev pulls in server too: the test suite imports server.py (tests/test_server_*.py,
# tests/e2e/test_flood_scenario.py), which needs mcp.
dev = ["multilayer-optical-mcp[server]", "pytest>=8", "pytest-cov>=5", "ruff==0.15.15"]

[project.scripts]
multilayer-optical-mcp = "multilayer_optical_mcp.server:main"
multilayer-optical-mcp-build = "multilayer_optical_mcp.build_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Runtime data the installed wheel must ship: the modulation-format catalog
# every ModeRegistry loads, and the german_17 reference topology used by the
# scenario builder, traffic generator, and e2e test. (Test-only oracles —
# eqpt/, toy_2span.json — live under tests/fixtures/ instead; they never ship.)
multilayer_optical_mcp = ["data/*.yaml", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff.lint.per-file-ignores]
# Tests deliberately group imports right above the section that uses them
# (each "# --- Task N ---" block is self-contained) and use semicolon-joined
# setup/assert one-liners for compact test bodies. Both are consistent,
# intentional conventions here, not accidental placement/formatting.
"tests/**" = ["E402", "E702"]
